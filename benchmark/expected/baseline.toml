# Benchmark Baseline
# Generated: 2026-04-01; refreshed 2026-04-26 after openac_core security fixes.
# 2026-04-28: refreshed after closing P0-5 (sdjwt b64 inclusion) and P1-4
# (jwt_x5c b64 payload binding).
# 2026-06-10: refreshed for v3.1 (spec/upgrade-plan-v3.1.md):
#   * Show-path unification: in-circuit challenge digest RETIRED; unified
#     credential_type-keyed link tag; epoch is a single Field.
#   * Passport commitment is arity-8 commit_passport_v3_1 (full-width
#     SOD/DG1 hashes; truncated 32-byte pack removed).
#   * v1/v2 circuits (passport_verifier, data_integrity, disclosure,
#     prepare_link, show_link, device_binding) retired to circuits-legacy/ --
#     dropped from this baseline; ~1.28 MB removed from the bundle.
#   Headline gate wins: openac_show 1802 -> 647 (-64%), passport_adapter
#   36247 -> 28596 (-21%), x509_show 549 -> 488 (-11%).
# Update this after confirmed improvements via: make bench-update-baseline

[meta]
created = "2026-04-01"
updated = "2026-06-10"
nargo_version = "1.0.0-beta.19"

# Minimum test counts per circuit (fail if below)
[tests]
# openac_core v3.1: show module rewritten (digest tests removed, unified
# link-tag + cross-domain replay tests added); profile claims pack/unpack
# tests replace passport_profile roundtrip; commit gains arity-8 tests.
openac_core = { positive = 53, negative = 3, total = 95 }
# openac_show v3.1: legacy digest tests removed; adds stale-nonce, forged
# claims, wrong-link-tag, CRITICAL-2 sentinel regressions.
openac_show = { positive = 8, negative = 8, total = 16 }
passport_adapter = { positive = 12, negative = 9, total = 21 }
sdjwt_adapter = { positive = 15, negative = 8, total = 23 }
jwt_x5c_adapter = { positive = 13, negative = 13, total = 26 }
# x509_show v3.1: digest negative test replaced by stale-nonce regression.
x509_show = { positive = 4, negative = 7, total = 11 }
# composite_show v3.1: +unlinkable positive; digest negative removed.
composite_show = { positive = 3, negative = 11, total = 14 }
mdoc_adapter = { positive = 13, negative = 15, total = 28 }

[tests.total]
minimum = 234

# Gate count baselines (ACIR opcodes, warn if > 10% regression)
# Measured: 2026-06-10, nargo 1.0.0-beta.19 (`nargo info --workspace`,
# main-function ACIR column).
[gates]
# v3.1 (-21% vs 36247): removing pack_passport_profile's truncation loops in
# favour of direct hash_to_fields halves + single claims Field.
passport_adapter = 28596
# v3.1 (-64% vs 1802): 2-block SHA256 challenge digest, epoch byte/field
# equality, and the packed-profile unpack/re-bind loops all removed.
openac_show = 647
sdjwt_adapter = 35255
jwt_x5c_adapter = 136440
# v3.1 (-11% vs 549): digest computation removed; unified tag.
x509_show = 488
# v3.1 (+1.5% vs 815): arity-8 passport opening slightly outweighs the
# removed composite digest. Acceptable -- still tiny.
composite_show = 827
mdoc_adapter = 692381

# Artifact sizes in bytes (warn if > 20% regression)
# Measured: 2026-06-10, nargo 1.0.0-beta.19 (circuits/target/*.json).
[artifact_bytes]
passport_adapter = 1334587
openac_show = 146805
sdjwt_adapter = 792963
jwt_x5c_adapter = 3242540
x509_show = 125312
composite_show = 150762
mdoc_adapter = 10119930
# 2026-06-10 v3.1: 15.9 MB vs 17.0 MB pre-v3.1 (legacy circuits dropped from
# the bundle + openac_show/passport_adapter shrink).
total = 15912899

# Bytes per gate (lower = more compact artifact representation)
# Grade: A(≤10) B(≤30) C(≤60) D(≤100) F(>100)
# NOTE: tiny show circuits (x509_show / composite_show / openac_show) grade F
# on this ratio by construction -- low gate count inflates bytes/gate; their
# absolute artifact size (<150 KB each) is what matters for the bundle.
[bytes_per_gate]
passport_adapter = 47
openac_show = 227
sdjwt_adapter = 22
jwt_x5c_adapter = 24
x509_show = 257
composite_show = 182
mdoc_adapter = 15

