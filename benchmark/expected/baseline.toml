# which are now retired to circuits-legacy/. v3.1 circuits need fresh
# Prover.toml fixtures before this section can be repopulated (Phase 0 of
# spec/upgrade-plan-v3.1.md).
# ============================================================
[witness_gen_ms]
status = "pending_v3_1_fixtures"

# ============================================================
# Real prove + verify timings.
#
# Toolchain: unblocked 2026-04-27 (noir_rs v1.0.0-beta.19; see git history
# for the migration notes). The only measured datapoint so far is the
# RETIRED v1 disclosure circuit -- kept as a reference magnitude because it
# demonstrates how heavily SHA256 blackboxes dominate mobile prove time
# (487 ACIR opcodes but 26.7 s prove / +309 MB RSS):
#   disclosure_prove_ms = 26690, disclosure_verify_ms = 83,
#   proof 18,724 B, vk 3,680 B, peak RSS +309 MB (darwin/arm64).
#
# v3.1 priority (upgrade-plan Phase 0): add bench wrappers in
# mopro-binding/src/noir.rs for openac_show / x509_show / composite_show /
# passport_adapter and record their prove/verify/RSS here. openac_show now
# carries ZERO SHA256 blocks; its remaining prove cost is dominated by the
# ECDSA-P256 device-binding blackbox.
# ============================================================
[performance]
status = "wrappers_pending_for_v3_1"
mopro_binding_noir_rs = "v1.0.0-beta.19"
host = "darwin/arm64"
