# Benchmark Spec Definition
# Machine-readable specification for all Noir circuits in this workspace.
# Used by benchmark scripts to verify CLAUDE.md compliance.

[meta]
nargo_version_prefix = "1.0.0-beta"
workspace_members = [
  "openac_core",
  "passport_adapter",
  "openac_show",
  "sdjwt_adapter",
  "jwt_x5c_adapter",
  "x509_show",
  "composite_show",
  "mdoc_adapter",
]

# ============================================================
# Architecture Versions
# ============================================================
# v1: SHA256-based commitments — RETIRED 2026-06-10 to circuits-legacy/
# v2: Pedersen arity-4 (device_binding) — RETIRED 2026-06-10 to circuits-legacy/
# v3: Pedersen arity-5 (+ pk_digest) — Path A; still used by the non-passport
#     adapters (sdjwt / jwt_x5c / mdoc aux commitments).
# v3.1 (2026-06-10, spec/upgrade-plan-v3.1.md): show-path unification.
#     * In-circuit challenge digest RETIRED — freshness rides on the pinned
#       public nonce_hash (also the ECDSA-P256 device-binding message).
#     * Unified link tag: pedersen([DOMAIN_LINK_TAG, credential_type,
#       link_rand, link_scope, epoch]) for every show circuit.
#     * Passport commitment is arity-8 commit_passport_v3_1 (full-width
#       SOD / DG1 hashes + single packed claims Field — no truncation).
#     * epoch is a single public Field everywhere.

[versions]
legacy_circuits = ["passport_verifier", "data_integrity", "disclosure", "prepare_link", "show_link", "device_binding"]
v3_1_circuits = [
  "openac_core",
  "passport_adapter",
  "openac_show",
  "sdjwt_adapter",
  "jwt_x5c_adapter",
  "x509_show",
  "composite_show",
  "mdoc_adapter",
]

# ============================================================
# Legacy circuits (retired 2026-06-10 — circuits-legacy/)
# ============================================================
# passport_verifier, data_integrity, disclosure, prepare_link, show_link (v1)
# and device_binding (v2) were retired by the v3.1 show-path unification
# (spec/upgrade-plan-v3.1.md Phase 3). Their sources and a standalone
# workspace live in circuits-legacy/; they are not compiled, tested, or
# shipped by default and have no [circuits.*] entries here. The v1 Rust
# verifier (mopro-binding/src/openac.rs) still validates old artifacts using
# committed test vectors.

# ============================================================
# Library: openac_core (v3.1 — Pedersen commitment + unified show)
# ============================================================
[circuits.openac_core]
type = "lib"
description = "Generic OpenAC building blocks: Pedersen commitment, device binding, unified show linking, predicates, profile encodings, revocation SMT, CSCA Master List Merkle"
version = "v3.1"

# v3 expanded the library beyond the original commit/show/predicate trio to
# host the Path A device-binding helpers (`device`), profile encodings
# (`profile`), the revocation SMT (`smt`), and the CSCA Master List Merkle
# verifier (`merkle`). All seven modules are first-class and shipped via
# `lib.nr`.
modules = ["commit", "device", "show", "predicate", "profile", "smt", "merkle", "base64"]

[circuits.openac_core.module_commit]
source = "circuits/openac_core/src/commit.nr"
functions = ["commit_attributes", "commit_attributes_v3", "commit_passport_v3_1", "hash_to_fields", "assert_commitment_eq"]
domain_constants = { DOMAIN_PASSPORT = "0x01", DOMAIN_X509 = "0x02", DOMAIN_SDJWT = "0x03", DOMAIN_MDL = "0x04", DOMAIN_SMT_NODE = "0x736d7431", DOMAIN_CSCA_NODE = "0x6373636e", DOMAIN_CSCA_LEAF = "0x6373636c", DOMAIN_REVOC_KEY = "0x726b6579", DOMAIN_X509_ISSUER = "0x78353039" }
assertions = ["Commitment X mismatch", "Commitment Y mismatch"]
min_positive_tests = 4
min_negative_tests = 1

[circuits.openac_core.module_device]
source = "circuits/openac_core/src/device.nr"
functions = ["verify_device_binding", "pk_digest_from_bytes"]
# pk_digest = pedersen_hash([DOMAIN_PK_DIGEST, pk_x_hi, pk_x_lo, pk_y_hi, pk_y_lo])
domain_constants = { DOMAIN_PK_DIGEST = "0x706b6467" }
assertions = ["Device binding: ECDSA P-256 signature verification failed"]
min_positive_tests = 4
min_negative_tests = 2

[circuits.openac_core.module_show]
source = "circuits/openac_core/src/show.nr"
functions = ["compute_link_tag", "compute_link_tag_with_mode", "verify_show"]
# v3.1 (2026-06-10): the in-circuit SHA256 challenge digest is RETIRED
# (domain "openac.show.v2" no longer appears in-circuit). Freshness rides on
# the pinned public nonce_hash — see show.nr header for the security
# argument. The unified link tag is the only show-phase domain anchor:
# link_tag = pedersen_hash([DOMAIN_LINK_TAG, credential_type, link_rand, link_scope, epoch])
domain_constants = { DOMAIN_LINK_TAG = "0x6c746167" }
assertions = ["Scoped link tag mismatch", "Unlinkable mode requires zero scope", "Unlinkable mode requires zero tag"]
min_positive_tests = 4
min_negative_tests = 3

[circuits.openac_core.module_predicate]
source = "circuits/openac_core/src/predicate.nr"
functions = ["check_age_above", "check_bytes3_eq", "two_digit_year_to_four", "decode_domain", "age_from_claims", "sdjwt_predicate_check", "domain_suffix_match"]
assertions = ["Birth year cannot be after current year"]
min_positive_tests = 4
min_negative_tests = 1

[circuits.openac_core.module_profile]
source = "circuits/openac_core/src/profile.nr"
functions = ["fields_to_bytes32", "derive_x509_link_rand", "derive_sdjwt_link_rand", "pack_passport_claims", "unpack_passport_claims", "pack_x509_domain", "unpack_x509_domain"]
# Path A salts for per-credential link_rand derivation (ASCII tags). The v3
# CHALLENGE_DOMAIN / LINK_TAG_DOMAIN digest constants were retired in v3.1
# (link tag moved to module_show with DOMAIN_LINK_TAG; digest removed).
domain_constants = { SALT_X509 = "0x78353039", SALT_SDJWT = "0x73646a77" }
assertions = ["Packed X.509 domain length exceeds maximum", "Birth month must fit in one byte", "Birth day must fit in one byte"]
min_positive_tests = 3
min_negative_tests = 1

[circuits.openac_core.module_smt]
source = "circuits/openac_core/src/smt.nr"
functions = ["verify_non_membership", "compute_serial_key", "hash_field_pair", "smt_fold", "pack_serial", "compute_x509_issuer_id"]
constants = { SMT_DEPTH = 32, SERIAL_KEY_BYTES = 4 }
assertions = ["Revocation witness matches blocked serial", "Revocation SMT root mismatch"]
min_positive_tests = 2
min_negative_tests = 2

[circuits.openac_core.module_merkle]
source = "circuits/openac_core/src/merkle.nr"
functions = ["verify_inclusion_depth_8", "compute_csca_leaf", "compute_csca_leaf_v2"]
constants = { CSCA_MERKLE_DEPTH = 8 }
assertions = ["CSCA Merkle root mismatch"]
min_positive_tests = 2
min_negative_tests = 3

[circuits.openac_core.module_base64]
source = "circuits/openac_core/src/base64.nr"
# base64url helpers used by the in-circuit JWS payload-inclusion proofs
# (sdjwt_adapter P0-5, jwt_x5c_adapter P1-4). b64url_encode_hash32 encodes a
# 32-byte disclosure hash to its 43-char base64url form; b64url_decode_into
# decodes a payload span back to bytes for byte-equality binding.
functions = ["b64url_value_to_char", "b64url_char_to_value", "b64url_encode_hash32", "b64url_decode_into"]
constants = { B64URL_HASH_BYTES = 32, B64URL_HASH_CHAR_LEN = 43 }
assertions = ["Invalid base64url character", "base64url out_len must match b64_len mod-4 layout"]
min_positive_tests = 4
min_negative_tests = 2

# ============================================================
# Circuit: passport_adapter (v3.1 — Path A combined prepare with CSCA chain)
# ============================================================
[circuits.passport_adapter]
type = "bin"
description = "Combined passport prepare (v3.1): DSC->SOD RSA verify + CSCA->DSC RSA chain + depth-8 Master List Merkle inclusion + depth-32 DSC revocation SMT + DG hash chain + arity-8 Pedersen commitment (commit_passport_v3_1, full-width SOD/DG1 hashes, pk_digest-bound)"
source = "circuits/passport_adapter/src/main.nr"
version = "v3.1"

gate_budget = 50000  # v3.1 sec.7.3 reduction measured 19,997 opcodes (was 28,596)

# v3.1 promotes the trust anchor model: `csca_root` (ICAO Master List snapshot)
# and `dsc_smt_root` (DSC revocation list) are the only non-commitment public
# inputs. The DSC RSA modulus is now a private witness because CSCA + Merkle
# inclusion proves its legitimacy.
# 2026-04-28 P0-3: `exponent` is also PUBLIC and asserted to equal 65537 in
# the circuit so verifiers can rely on the DSC RSA exponent being ICAO-mandated.
public_inputs = [
  "csca_root", "dsc_smt_root",
  "exponent",
  "out_commitment_x", "out_commitment_y",
]
public_input_types = ["Field", "Field", "u32", "Field", "Field"]

private_inputs = [
  "sod_hash", "signature_limbs", "modulus_limbs", "redc_limbs",
  "csca_modulus_limbs", "csca_redc_limbs",
  "dsc_tbs", "dsc_cert_sig_limbs",
  "csca_merkle_index", "csca_merkle_siblings",
  "csca_tbs_hash_hi", "csca_tbs_hash_lo",
  "dsc_serial", "smt_siblings", "smt_old_key", "smt_old_value", "smt_is_old0",
  "dg_count", "dg_contents", "dg_lengths", "expected_dg_hashes",
  "link_rand",
  "enclave_pk_x", "enclave_pk_y",
]
private_input_types = [
  "[u8; 32]", "[u128; 18]", "[u128; 18]", "[u128; 18]",
  "[u128; 18]", "[u128; 18]",
  "[u8; 512]", "[u128; 18]",
  "u32", "[Field; 8]",
  "Field", "Field",
  "[u8; 20]", "[Field; 32]", "Field", "Field", "bool",
  "u8", "[[u8; 512]; 2]", "[u32; 2]", "[[u8; 32]; 2]",
  "Field",
  "[u8; 32]", "[u8; 32]",
]

# 2026-04-28 P1-7 follow-up: passport_adapter switched to compute_csca_leaf_v2
# in both `verify_csca_chain` and the DSC revocation SMT issuer_id derivation.
# `csca_tbs_hash_hi/lo` are private witnesses constrained by the Master List
# Merkle root (a tampered hash produces a leaf that no longer matches the
# off-chain snapshot's path).
assertions = [
  "Passport DSC exponent must be 65537 (ICAO 9303 v3 trust model)",
  "Passport DSC signature verification failed",
  "CSCA signature over DSC TBS failed verification",
  "DSC modulus mismatch with CSCA-signed TBS",
  "CSCA Merkle root mismatch",
  "dsc_serial must match the CSCA-signed TBS serial bytes",
  "Revocation witness matches blocked serial",
  "Revocation SMT root mismatch",
  "Too many data groups",
  "Must have at least one data group",
  "DG length exceeds maximum",
  "Data group hash mismatch",
  "SOD combined hash mismatch",
  "Commitment X mismatch",
  "Commitment Y mismatch",
]

constants = { MAX_DG_COUNT = 2, MAX_DG_SIZE = 512, DSC_TBS_LEN = 512, DSC_SERIAL_OFFSET = 352, DSC_SERIAL_LEN = 20, CSCA_MERKLE_DEPTH = 8, SMT_DEPTH = 32, CSCA_RSA_EXPONENT = 65537, DSC_RSA_EXPONENT = 65537 }

min_positive_tests = 7   # v3.1 unit tests: DG chain + commitment + DSC extract + revocation
min_negative_tests = 6

exports = { out_commitment_x = "Field", out_commitment_y = "Field" }

[circuits.passport_adapter.dependencies]
noir_rsa = "v0.10.0"
bignum = "v0.9.2"
sha256 = "v0.3.0"
openac_core = "path"

# ============================================================
# Circuit: openac_show (v3.1 — Path A passport show, digest-free)
# ============================================================
[circuits.openac_show]
type = "bin"
description = "OpenAC passport show (v3.1): in-circuit ECDSA-P256 device binding over pinned nonce_hash + arity-8 commitment re-open + unified link tag + predicates"
source = "circuits/openac_show/src/main.nr"
version = "v3.1"

public_inputs = [
  "credential_type",
  "nonce_hash",
  "link_mode", "link_scope", "epoch",
  "current_year", "current_month", "current_day", "age_threshold",
  "disclose_nationality", "disclose_age",
  "out_commitment_x", "out_commitment_y",
  "out_link_tag",
  "out_is_older", "out_nationality",
]
public_input_types = [
  "Field",
  "[u8; 32]",
  "bool", "Field", "Field",
  "u32", "u32", "u32", "u32",
  "bool", "bool",
  "Field", "Field",
  "Field",
  "bool", "[u8; 3]",
]

# v3.1 (2026-06-10, spec/upgrade-plan-v3.1.md):
#   * `challenge` / `out_challenge_digest` / `epoch[u8;4]` / `epoch_field`
#     REMOVED — freshness rides on the pinned public `nonce_hash`, which is
#     also the ECDSA-P256 message of the in-circuit device binding.
#   * Commitment opening is arity-8 `commit_passport_v3_1` with full-width
#     SOD / DG1 hash halves; predicates come from the single packed `claims`
#     Field (no separate birth/nationality witnesses to re-bind).
#   * CRITICAL-2 (2026-06-10): undisclosed outputs are pinned to zero
#     sentinels in-circuit.
private_inputs = [
  "claims", "sod_hash_hi", "sod_hash_lo", "dg1_hash_hi", "dg1_hash_lo",
  "link_rand",
  "enclave_pk_x", "enclave_pk_y", "signature",
]
private_input_types = [
  "Field", "Field", "Field", "Field", "Field",
  "Field",
  "[u8; 32]", "[u8; 32]", "[u8; 64]",
]

assertions = [
  "openac_show only accepts DOMAIN_PASSPORT credentials",
  "Commitment X mismatch",
  "Commitment Y mismatch",
  "Scoped link tag mismatch",
  "Unlinkable mode requires zero scope",
  "Unlinkable mode requires zero tag",
  "Age predicate output mismatch",
  "Nationality output mismatch",
  "out_is_older must be false when age not disclosed",
  "out_nationality must be zero when nationality not disclosed",
]

min_positive_tests = 6
min_negative_tests = 8

imports = { out_commitment_x = "passport_adapter", out_commitment_y = "passport_adapter" }

[circuits.openac_show.dependencies]
openac_core = "path"

# ============================================================
# Circuit: sdjwt_adapter (v3.2 — Path A SD-JWT prepare with inclusion proof)
# ============================================================
[circuits.sdjwt_adapter]
type = "bin"
description = "OpenAC SD-JWT adapter (v3.2): ES256 issuer ECDSA + disclosure hash chain + base64url-inclusion proof against issuer-signed payload + Pedersen v3 commitment bound to enclave pk_digest"
source = "circuits/sdjwt_adapter/src/main.nr"
version = "v3.2"

# `jwt_payload_hash` is `pub` so the verifier can independently confirm which
# payload the issuer signed (a private payload hash would let a prover swap
# the signed payload silently). `out_sd_root_{hi,lo}` are `pub` so the verifier
# can externally link which disclosure set was committed.
# 2026-04-28 P0-5 (closed): the circuit now binds `jwt_payload_raw` to
# `jwt_payload_hash` via sha256_var and proves each disclosure hash, base64url-
# encoded, appears in the issuer-signed payload bytes at a witnessed offset.
# `out_disclosure_root` is retained for off-chain manifest pinning.
public_inputs = [
  "jwt_payload_hash",
  "issuer_pk_x", "issuer_pk_y",
  "out_commitment_x", "out_commitment_y",
  "out_sd_root_hi", "out_sd_root_lo",
  "out_disclosure_root",
]
public_input_types = [
  "[u8; 32]",
  "[u8; 32]", "[u8; 32]",
  "Field", "Field",
  "Field", "Field",
  "Field",
]

# v3.2 adds `jwt_payload_raw`, `jwt_payload_raw_len`, `disclosure_positions`
# private witnesses for the base64url inclusion proof closing P0-5. v3 still
# requires `enclave_pk_x` / `enclave_pk_y` for pk_digest derivation.
private_inputs = [
  "signature",
  "disclosure_count", "disclosure_salts", "claim_values", "claim_lengths", "expected_disclosure_hashes",
  "jwt_payload_raw", "jwt_payload_raw_len", "disclosure_positions",
  "link_rand_p",
  "enclave_pk_x", "enclave_pk_y",
]
private_input_types = [
  "[u8; 64]",
  "u8", "[[u8; 16]; 8]", "[[u8; 64]; 8]", "[u32; 8]", "[[u8; 32]; 8]",
  "[u8; 1024]", "u32", "[u32; 8]",
  "Field",
  "[u8; 32]", "[u8; 32]",
]

assertions = [
  "SD-JWT ES256 signature verification failed",
  "Too many disclosures",
  "Claim length exceeds maximum",
  "SD-JWT disclosure hash mismatch",
  "jwt_payload_raw_len exceeds JWT_PAYLOAD_LEN",
  "jwt_payload_raw hash does not match issuer-signed jwt_payload_hash",
  "Disclosure position window past payload buffer",
  "Disclosure position window past active payload bytes",
  "Disclosure hash not present in issuer-signed payload at witnessed offset",
  "Commitment X mismatch",
  "Commitment Y mismatch",
  "out_disclosure_root must match Pedersen-bound disclosure root",
]

constants = { MAX_DISCLOSURES = 8, MAX_CLAIM_SIZE = 64, SALT_SIZE = 16, JWT_PAYLOAD_LEN = 1024 }

min_positive_tests = 8
min_negative_tests = 2

exports = { out_commitment_x = "Field", out_commitment_y = "Field", out_sd_root_hi = "Field", out_sd_root_lo = "Field", out_disclosure_root = "Field" }

# ============================================================
# Circuit: mdoc_adapter (v2 — Path A mDoc / mDL prepare, Direction D)
# ============================================================
# Direction D third slice (2026-04-27). v2 adds:
#   * validUntil extraction: 13-byte CBOR prefix substring inclusion
#     followed by ASCII date parse to YYYYMMDD (public output).
#   * Device-key extraction from the issuer-signed mso. The 32+32
#     coordinate bytes are read from the message (anchored by the
#     8-byte COSE_Key prefix and 3-byte y-prefix) and used to derive
#     pk_digest. This drops the v1 `enclave_pk_x/y` private witnesses
#     -- the prover can no longer point at an arbitrary device key.
# v0 + v1 layers (issuer ECDSA-P256, per-claim envelope authenticity +
# substring inclusion, Pedersen v3 commitment) are preserved.
[circuits.mdoc_adapter]
type = "bin"
description = "OpenAC mDoc / mDL adapter (v2): ECDSA-P256 issuer signature + variable-position CBOR substring inclusion + per-claim digest envelope verification + validUntil parsing + deviceKey extraction from mso + Pedersen v3 commitment bound to extracted pk_digest"
source = "circuits/mdoc_adapter/src/main.nr"
version = "v3"

public_inputs = [
  "issuer_pk_x", "issuer_pk_y",
  "out_valid_until",
  "out_commitment_x", "out_commitment_y",
]
public_input_types = ["[u8; 32]", "[u8; 32]", "u32", "Field", "Field"]

# v2 drops `enclave_pk_x` / `enclave_pk_y` private witnesses (now
# extracted in-circuit from the issuer-signed mso) and adds two layout
# pointers: `valid_until_prefix_pos` and `device_key_prefix_pos`.
private_inputs = [
  "claim_count", "preimages", "preimage_lens", "digest_ids", "expected_envelopes",
  "message", "message_len", "envelope_positions", "issuer_signature",
  "valid_until_prefix_pos", "device_key_prefix_pos",
  "link_rand",
]
private_input_types = [
  "u8", "[[u8; 256]; 4]", "[u32; 4]", "[u8; 4]", "[[u8; 35]; 4]",
  "[u8; 512]", "u32", "[u32; 4]", "[u8; 64]",
  "u32", "u32",
  "Field",
]

assertions = [
  "mDoc preimage length exceeds maximum",
  "mDoc digest envelope: digest_id byte mismatch",
  "mDoc digest envelope: CBOR bytes(32) marker (0x58) mismatch",
  "mDoc digest envelope: CBOR length byte (0x20) mismatch",
  "mDoc digest envelope: preimage hash mismatch",
  "mDoc must contain at least one claim",
  "mDoc claim count exceeds MAX_CLAIMS",
  "mDoc message length exceeds maximum",
  "mDoc issuer ECDSA-P256 signature verification failed",
  "mDoc substring window past message_len",
  "mDoc substring byte does not match issuer-signed message",
  "mDoc validUntil: expected '-' at byte 4",
  "mDoc validUntil: expected '-' at byte 7",
  "mDoc validUntil date window past message_len",
  "mDoc validUntil extracted from mso does not match public output",
  "mDoc deviceKey window past message_len",
  "Commitment X mismatch",
  "Commitment Y mismatch",
]

constants = { MAX_CLAIMS = 4, MAX_PREIMAGE_LEN = 256, MAX_MSG_LEN = 512, ENCODED_DIGEST_LEN = 35, VALID_UNTIL_PREFIX_LEN = 13, VALID_UNTIL_DATE_LEN = 10, DEVICE_KEY_PREFIX_LEN = 8, DEVICE_KEY_Y_PREFIX_LEN = 3, DEVICE_KEY_COORD_LEN = 32, CBOR_BYTES_32_MARKER = "0x58", CBOR_BYTES_32_LENGTH = "0x20" }

min_positive_tests = 10
min_negative_tests = 14

exports = { out_valid_until = "u32", out_commitment_x = "Field", out_commitment_y = "Field" }

# ============================================================
# Circuit: jwt_x5c_adapter (v3.1 — Path A X.509 / OIDC RS256 prepare)
# ============================================================
[circuits.jwt_x5c_adapter]
type = "bin"
description = "X.509 x5c JWT prepare adapter (v3.1, RSA variant): RSA cert chain verification + Pedersen-SMT non-membership (depth 32) + RSA JWT signature + fixed-offset issuer claim extraction + Pedersen v3 commitment bound to enclave pk_digest"
source = "circuits/jwt_x5c_adapter/src/main.nr"
version = "v3.1"

# v3.1 (2026-04-17): 20,784 ACIR opcodes vs 65,000 target -- 94.6% reduction
# from v3.0's 384,147. Optimizations: SMT SHA256 -> pedersen_hash with
# DOMAIN_SMT_NODE, SMT_DEPTH 128 -> 32, JWT_PAYLOAD_LEN 4096 -> 1024,
# fixed-offset issuer claim extraction dispatched by `issuer_format_tag`.
# See spec/x509-benchmark.md sec. 3 / sec. 9 and spec/x509-migration.md sec. 9.
# v3.2 (2026-04-28, P1-4 closure): gate budget raised to 200k to absorb the
# ~115k-gate cost of in-circuit base64url decoding of the JWS payload section
# + byte-equality with jwt_payload_norm. The cost is mandatory: without it
# the issuer-signed bytes and the claims that feed the commitment are
# unrelated, so verifier policy could not enforce that the issuer attested
# to the claims being committed.
gate_budget = 200000
gate_budget_status = "within_budget"

public_inputs = [
  "jwt_payload_b64h", "jwt_signed_hash",
  "issuer_modulus",
  "smt_root",
  "issuer_format_tag",
  "out_commitment_x", "out_commitment_y",
]
public_input_types = [
  "[u8; 32]", "[u8; 32]",
  "[u128; 18]",
  "Field",
  "Field",
  "Field", "Field",
]

private_inputs = [
  "leaf_tbs", "issuer_tbs",
  "leaf_sig", "issuer_sig",
  "serial_number",
  "smt_siblings", "smt_old_key", "smt_old_value", "smt_is_old0",
  "jwt_payload_norm",
  "jwt_signing_input", "jwt_signing_input_len",
  "payload_b64_offset", "payload_b64_len", "payload_norm_len",
  "jwt_sig",
  "jwt_modulus_limbs", "jwt_redc_limbs", "issuer_redc_limbs",
  "link_rand_p",
  "enclave_pk_x", "enclave_pk_y",
]
private_input_types = [
  "[u8; 1536]", "[u8; 1536]",
  "[u128; 18]", "[u128; 18]",
  "[u8; 20]",
  "[Field; 32]", "Field", "Field", "bool",
  "[u8; 1024]",
  "[u8; 1536]", "u32",
  "u32", "u32", "u32",
  "[u128; 18]",
  "[u128; 18]", "[u128; 18]", "[u128; 18]",
  "Field",
  "[u8; 32]", "[u8; 32]",
]

# 2026-04-28 P0-4: jwt_signing_input + jwt_signing_input_len are private
# witnesses that bind sha256_var(input, len) == jwt_signed_hash.
# 2026-04-28 P1-4 (closed): payload_b64_offset / payload_b64_len /
# payload_norm_len locate the payload section of the JWS signing input. The
# circuit base64url-decodes that section in-circuit and asserts byte-equality
# with jwt_payload_norm, so the bytes the issuer RSA-signed (covered by
# jwt_signed_hash) provably decode to the canonical payload that feeds the
# commitment.
assertions = [
  "Leaf certificate signature verification failed",
  "Issuer certificate signature verification failed",
  "Leaf cert JWT modulus mismatch",
  "serial_number must match the issuer-signed leaf TBS serial bytes",
  "Revocation witness matches blocked serial",
  "Revocation SMT root mismatch",
  "Unsupported issuer_format_tag (accepted: 1=GoogleOIDCv1, 2=AppleIDv1, 3=MicrosoftEntraV1)",
  "Normalized JWT domain missing value",
  "JWT payload hash mismatch",
  "JWT signing input hash does not match jwt_signed_hash",
  "jwt_signing_input_len exceeds JWT_SIGNING_INPUT_LEN",
  "payload b64 window past signing input",
  "payload b64 must follow header.dot",
  "payload b64 must follow a '.' separator",
  "jwt_payload_norm does not match base64url-decoded signing-input payload",
  "JWT signature verification failed",
  "Commitment X mismatch",
  "Commitment Y mismatch",
]

constants = { CERT_TBS_LEN = 1536, JWT_PAYLOAD_LEN = 1024, JWT_SIGNING_INPUT_LEN = 1536, LIMB_COUNT = 18, SMT_DEPTH = 32, RSA_EXPONENT = 65537, LEAF_SERIAL_OFFSET = 352, LEAF_SERIAL_LEN = 20, ISSUER_FORMAT_GOOGLE_OIDC_V1 = 1, ISSUER_FORMAT_APPLE_ID_V1 = 2, ISSUER_FORMAT_MICROSOFT_ENTRA_V1 = 3, GOOGLE_OIDC_V1_EMAIL_DOMAIN_OFFSET = 17, APPLE_ID_V1_EMAIL_DOMAIN_OFFSET = 16, MICROSOFT_ENTRA_V1_EMAIL_DOMAIN_OFFSET = 15 }

min_positive_tests = 8
min_negative_tests = 5

exports = { out_commitment_x = "Field", out_commitment_y = "Field" }

[circuits.jwt_x5c_adapter.dependencies]
noir_rsa = "v0.10.0"
bignum = "v0.9.2"
sha256 = "v0.3.0"
openac_core = "path"

# ============================================================
# Circuit: x509_show (v3.1 — Path A X.509 show, digest-free)
# ============================================================
[circuits.x509_show]
type = "bin"
description = "X.509 show (v3.1): in-circuit ECDSA-P256 device binding over pinned nonce_hash + v3 commitment re-open + domain predicate + unified link tag"
source = "circuits/x509_show/src/main.nr"
version = "v3.1"

gate_budget = 5000

public_inputs = [
  "in_commitment_x509_x", "in_commitment_x509_y",
  "nonce_hash",
  "target_domain_hash",
  "link_mode", "link_scope", "epoch",
  "out_link_tag", "out_domain_match",
]
public_input_types = [
  "Field", "Field",
  "[u8; 32]",
  "Field",
  "bool", "Field", "Field",
  "Field", "Field",
]

private_inputs = [
  "attr_hi", "attr_lo", "link_rand_x",
  "enclave_pk_x", "enclave_pk_y", "signature",
]
private_input_types = [
  "Field", "Field", "Field",
  "[u8; 32]", "[u8; 32]", "[u8; 64]",
]

# v3.1 (2026-06-10): `out_challenge_digest` REMOVED — freshness rides on the
# pinned public nonce_hash (also the ECDSA device-binding message). Link tag
# moved to the unified openac_core::show construction (credential_type-keyed).
assertions = [
  "Commitment X mismatch",
  "Commitment Y mismatch",
  "Domain match predicate mismatch",
  "Domain match must be boolean (0 or 1)",
  "Scoped link tag mismatch",
  "Unlinkable mode requires zero scope",
  "Unlinkable mode requires zero tag",
]

min_positive_tests = 4
min_negative_tests = 5

imports = { in_commitment_x509_x = "jwt_x5c_adapter", in_commitment_x509_y = "jwt_x5c_adapter" }

[circuits.x509_show.dependencies]
openac_core = "path"

# ============================================================
# Circuit: composite_show (v3.1 — Path A passport + aux bundle show)
# ============================================================
[circuits.composite_show]
type = "bin"
description = "Composite show (v3.1): single ECDSA-P256 verify over pinned nonce_hash + re-open arity-8 passport & arity-5 aux commitments sharing the same pk_digest + age predicate + aux predicate + unified link tag"
source = "circuits/composite_show/src/main.nr"
version = "v3.1"

gate_budget = 8000

public_inputs = [
  "in_commitment_passport_x", "in_commitment_passport_y",
  "in_commitment_aux_x", "in_commitment_aux_y",
  "aux_domain",
  "nonce_hash",
  "age_threshold",
  "current_year", "current_month", "current_day",
  "target_aux_hash",
  "link_mode", "link_scope", "epoch",
  "out_link_tag", "out_is_older", "out_aux_predicate",
]
public_input_types = [
  "Field", "Field",
  "Field", "Field",
  "Field",
  "[u8; 32]",
  "Field",
  "Field", "Field", "Field",
  "Field",
  "bool", "Field", "Field",
  "Field", "Field", "Field",
]

private_inputs = [
  "p_claims", "p_sod_hash_hi", "p_sod_hash_lo", "p_dg1_hash_hi", "p_dg1_hash_lo",
  "link_rand_p",
  "a_attr_hi", "a_attr_lo",
  "enclave_pk_x", "enclave_pk_y", "signature",
]
private_input_types = [
  "Field", "Field", "Field", "Field", "Field",
  "Field",
  "Field", "Field",
  "[u8; 32]", "[u8; 32]", "[u8; 64]",
]

# v3.1 (2026-06-10): `out_challenge_digest` REMOVED; passport opening is
# arity-8 commit_passport_v3_1; the link tag is keyed on (DOMAIN_PASSPORT,
# link_rand_p) via the unified construction — deliberately equal to
# openac_show's tag for the same holder/scope/epoch (scoped linkability
# recognises the holder across solo and bundle presentations).
assertions = [
  "aux_domain must be DOMAIN_X509 or DOMAIN_SDJWT",
  "Commitment X mismatch",
  "Commitment Y mismatch",
  "Age predicate mismatch",
  "out_is_older must be boolean (0 or 1)",
  "Aux predicate mismatch",
  "out_aux_predicate must be boolean (0 or 1)",
  "Scoped link tag mismatch",
  "Unlinkable mode requires zero scope",
  "Unlinkable mode requires zero tag",
]

min_positive_tests = 3
min_negative_tests = 8

imports = { in_commitment_passport_x = "passport_adapter", in_commitment_passport_y = "passport_adapter", in_commitment_aux_x = "jwt_x5c_adapter", in_commitment_aux_y = "jwt_x5c_adapter" }

[circuits.composite_show.dependencies]
openac_core = "path"

# ============================================================
# Cross-Circuit Commitment Chain (v3.1 flow — Path A)
# ============================================================
# (The v1 SHA256 hash chain was retired with circuits-legacy/ on 2026-06-10.)
# passport_adapter and openac_show / composite_show share the v3.1 arity-8
# passport Pedersen commitment (`commit_passport_v3_1`, pk_digest-bound).
# x509 / sdjwt aux commitments stay on arity-5 `commit_attributes_v3` and
# share the same pk_digest across credentials.
[cross_circuit.v3_commitment_chain]
description = "Pedersen commitment chain linking Path A circuits (passport arity-8 v3.1; aux arity-5 v3)"

[[cross_circuit.v3_commitment_chain.links]]
from = "passport_adapter"
to = "openac_show"
via = "out_commitment_x"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "passport_adapter"
to = "openac_show"
via = "out_commitment_y"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "passport_adapter"
to = "composite_show"
via = "out_commitment_x"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "passport_adapter"
to = "composite_show"
via = "out_commitment_y"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "jwt_x5c_adapter"
to = "x509_show"
via = "out_commitment_x"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "jwt_x5c_adapter"
to = "x509_show"
via = "out_commitment_y"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "jwt_x5c_adapter"
to = "composite_show"
via = "out_commitment_x"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "jwt_x5c_adapter"
to = "composite_show"
via = "out_commitment_y"
type = "Field"

# NOTE (2026-06-10): sdjwt_adapter does NOT link to openac_show. openac_show
# hard-asserts credential_type == DOMAIN_PASSPORT (P1-8), so an SD-JWT
# (DOMAIN_SDJWT) commitment can never be opened there. SD-JWT commitments flow
# only into composite_show (links below). See spec/v3-security-size-balance.md §4.
[[cross_circuit.v3_commitment_chain.links]]
from = "sdjwt_adapter"
to = "composite_show"
via = "out_commitment_x"
type = "Field"

[[cross_circuit.v3_commitment_chain.links]]
from = "sdjwt_adapter"
to = "composite_show"
via = "out_commitment_y"
type = "Field"

# ============================================================
# Cross-Layer Domain Separators
# ============================================================
[cross_layer.domain_separators]

# v1 separators are only used by the legacy Rust verifier (openac.rs) for
# previously-issued artifacts; the v1 circuits live in circuits-legacy/.
[cross_layer.domain_separators.v1]
prepare = "openac.preparev1"
show = "openac.show.v1"
scope = "openac.scope.v1"

# v2 SHA256 digest domains RETIRED in v3.1 (2026-06-10) — no in-circuit
# challenge digest exists anymore. Kept here only as a historical record so
# the strings are never reused for a different construction.
[cross_layer.domain_separators.v2_retired]
show = "openac.show.v2"
scope = "openac.scope.v2"

# v3.1 show-phase anchor (in-circuit, openac_core::show)
[cross_layer.domain_separators.v3_1]
link_tag = "0x6c746167"  # ASCII "ltag" (DOMAIN_LINK_TAG)

# Rust layer references (mopro-binding/src/openac.rs)
[cross_layer.rust]
source = "mopro-binding/src/openac.rs"
domain_separators_version = "v1"  # legacy Rust verifier targets v1 artifacts
v3_source = "mopro-binding/src/openac_v3.rs"  # v3.1: nonce_hash pinning, no digest

# ============================================================
# Performance Baselines (update after benchmarking)
# ============================================================
[performance.thresholds]
max_gate_count_regression_pct = 10
max_compile_time_regression_pct = 20
