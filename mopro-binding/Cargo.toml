[package]
name = "passport-zk-mopro"
version = "0.1.0"
edition = "2021"
description = "Mopro FFI bindings for passport ZK verification circuits (Noir) → Swift"

[dependencies]
# Pinned exactly: mopro-ffi 0.3.6 removed `KotlinBindingGenerator` (used by
# bin/android_zig.rs) and bumped uniffi 0.29 -> 0.31. Cargo.lock is gitignored,
# so CI/release resolve fresh -- without this pin `cargo build` picks 0.3.6 and
# fails with `unresolved import mopro_ffi::KotlinBindingGenerator`. Re-check the
# binding-generator API before unpinning.
mopro-ffi = "=0.3.5"
noir_rs = { package = "noir", git = "https://github.com/zkmopro/noir-rs", features = ["barretenberg"], tag = "v1.0.0-beta.19" }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
# Needed only by `bin/android_zig.rs` for the UniFFI bindings step.
# `uniffi` itself is reached via `mopro_ffi::*` (mopro-ffi does
# `pub use uniffi::*;`) to avoid the macro vs direct-extern name
# clash that `mopro_ffi::app!()` triggers when uniffi appears as a
# direct dep.
camino = "1.1"

[build-dependencies]
mopro-ffi = "=0.3.5"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ios"
path = "src/bin/ios.rs"

[[bin]]
name = "android"
path = "src/bin/android.rs"

# Zig-linked variant — links our cdylib with `zig cc` so the bundled
# upstream libc++ (the same `__1`-namespaced ABI that AztecProtocol's
# prebuilt `libbb-external.a` was built against) is statically linked
# into the .so. The default `android` bin uses cargo-ndk + NDK libc++
# which has the wrong inline namespace and produces a .so that can't
# dlopen on device. See KNOWN_ISSUES.md in the passport-zk Nitro
# module for the full diagnosis.
[[bin]]
name = "android_zig"
path = "src/bin/android_zig.rs"

[[bin]]
name = "gen_srs"
path = "src/bin/gen_srs.rs"

[features]
default = ["uniffi"]
uniffi = ["mopro-ffi/uniffi"]
